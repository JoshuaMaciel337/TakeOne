name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (lint e testes)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Instalar o FFmpeg (testes de ingestão)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Instalar o deep-filter (testes da voz limpa)
        run: |
          sudo curl -sSL -o /usr/local/bin/deep-filter https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl
          echo "70775e251eee44c0f2451a1e833326cf8bcbbe304d3e7cd12851e6fce72ef7da  /usr/local/bin/deep-filter" | sha256sum -c -
          sudo chmod 755 /usr/local/bin/deep-filter
      - name: Baixar o modelo de rostos (testes do reenquadramento)
        run: |
          curl -sSL -o "$RUNNER_TEMP/yunet.onnx" https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  $RUNNER_TEMP/yunet.onnx" | sha256sum -c -
          echo "MODELO_ROSTO=$RUNNER_TEMP/yunet.onnx" >> "$GITHUB_ENV"
      - name: Baixar o modelo de recorte (testes do recorte do fundo)
        run: |
          curl -sSL -o "$RUNNER_TEMP/modnet.onnx" https://huggingface.co/Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model.onnx
          echo "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9  $RUNNER_TEMP/modnet.onnx" | sha256sum -c -
          echo "MODELO_RECORTE=$RUNNER_TEMP/modnet.onnx" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
        env:
          MONGO_URI: mongodb://localhost:27017/?directConnection=true

  web:
    name: Web (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
