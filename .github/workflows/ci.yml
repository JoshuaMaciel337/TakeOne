name: CI

on:
  push:
  pull_request:

# Um push novo cancela a execução anterior do mesmo ramo: ela testaria um código que já mudou
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint e testes)
    # Fixo no 24.04: o ubuntu-latest passou a ser o 26, e o CI confere o FFmpeg 6.1 deste (o worker usa o 7)
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - name: Instalar o FFmpeg e o espeak-ng (testes de ingestão e dos fonemas do texto em fala)
        # Os espelhos do apt às vezes levam meia hora (medido: 26 min num dia lento); o limite só corta o que travou
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg espeak-ng fonts-noto-color-emoji
      - name: Instalar o deep-filter (testes da voz limpa)
        run: |
          sudo curl -sSL -o /usr/local/bin/deep-filter https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl
          echo "70775e251eee44c0f2451a1e833326cf8bcbbe304d3e7cd12851e6fce72ef7da  /usr/local/bin/deep-filter" | sha256sum -c -
          sudo chmod 755 /usr/local/bin/deep-filter
      - name: Baixar o modelo de rostos (testes do reenquadramento)
        run: |
          curl -sSL -o "$RUNNER_TEMP/yunet.onnx" https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4  $RUNNER_TEMP/yunet.onnx" | sha256sum -c -
          echo "MODELO_ROSTO=$RUNNER_TEMP/yunet.onnx" >> "$GITHUB_ENV"
      - name: Baixar os pontos do rosto e o vetor das fotos (testes do álbum de fotos)
        run: |
          curl -sSL -o "$RUNNER_TEMP/face_landmarker.task" https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          echo "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  $RUNNER_TEMP/face_landmarker.task" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rosto" && python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/face_landmarker.task" "$RUNNER_TEMP/rosto"
          echo "MODELO_PONTOS_DO_ROSTO=$RUNNER_TEMP/rosto/face_landmarks_detector.tflite" >> "$GITHUB_ENV"
          echo "MODELO_EXPRESSOES=$RUNNER_TEMP/rosto/face_blendshapes.tflite" >> "$GITHUB_ENV"
          curl -sSL -o "$RUNNER_TEMP/dinov2_small.onnx" https://huggingface.co/onnx-community/dinov2-small-ONNX/resolve/08c606e3123472a388efa59181b677d428f69bbd/onnx/model.onnx
          echo "6266c3cd72db6953cecdcbfeab9422a9f783d96f1a4e296ba70ffbac43b54a18  $RUNNER_TEMP/dinov2_small.onnx" | sha256sum -c -
          echo "MODELO_VETOR_DA_FOTO=$RUNNER_TEMP/dinov2_small.onnx" >> "$GITHUB_ENV"
          curl -sSL -o "$RUNNER_TEMP/sface.onnx" https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          echo "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  $RUNNER_TEMP/sface.onnx" | sha256sum -c -
          echo "MODELO_PESSOA=$RUNNER_TEMP/sface.onnx" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/owlvit"
          curl -sSL -o "$RUNNER_TEMP/owlvit/tokenizer.json" https://huggingface.co/Xenova/owlvit-base-patch32/resolve/b75f4e52949639c3bb0b96546ea4149482f6e7ef/tokenizer.json
          echo "50b24e94079fb11cb1503f65fef0ed08044186a1cd118c79683991554d9a5b23  $RUNNER_TEMP/owlvit/tokenizer.json" | sha256sum -c -
          echo "MODELO_DISTRACOES=$RUNNER_TEMP/owlvit/model.onnx" >> "$GITHUB_ENV"
      - name: Baixar o rastreador de objetos (testes do texto que segue um objeto)
        run: |
          curl -sSL -o "$RUNNER_TEMP/vittrack.onnx" https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/object_tracking_vittrack/object_tracking_vittrack_2023sep.onnx
          echo "2990f0b7cd44d92afa48cd97db6de7be113fc1d9594fddb74e2725c10478e91d  $RUNNER_TEMP/vittrack.onnx" | sha256sum -c -
          echo "MODELO_RASTREIO=$RUNNER_TEMP/vittrack.onnx" >> "$GITHUB_ENV"
      - name: Baixar o modelo de recorte (testes do recorte do fundo)
        run: |
          curl -sSL -o "$RUNNER_TEMP/modnet.onnx" https://huggingface.co/Xenova/modnet/resolve/fa2fa546052fba4c08921230a26cc69a333fca12/onnx/model.onnx
          echo "07c308cf0fc7e6e8b2065a12ed7fc07e1de8febb7dc7839d7b7f15dd66584df9  $RUNNER_TEMP/modnet.onnx" | sha256sum -c -
          echo "MODELO_RECORTE=$RUNNER_TEMP/modnet.onnx" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - name: Instalar o Chromium (testes das animações em HTML)
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: playwright install --with-deps chromium-headless-shell
      - run: ruff check .
      - run: pytest -q
        env:
          MONGO_URI: mongodb://localhost:27017/?directConnection=true

  web:
    name: Web (lint, tipos, testes e build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
