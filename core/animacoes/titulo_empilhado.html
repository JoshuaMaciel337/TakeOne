<script type="application/json" id="modelo">
{
 "nome": "Palavras empilhadas",
 "categoria": "titulos",
 "motor": "css",
 "duracao": 4.5,
 "descricao": "Uma palavra por linha, bem grandes, entrando alternadas pela esquerda e pela direita; as linhas pares são só o contorno.",
 "campos": [
  {"id": "texto", "rotulo": "Palavras (uma por linha)", "tipo": "linhas", "padrao": "CRIE\nEDITE\nPUBLIQUE", "maximo": 60},
  {"id": "cor_1", "rotulo": "Linhas cheias (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Linhas cheias (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Contorno", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Empilhadas: cada linha do campo vira um bloco; as ímpares (1ª, 3ª...) vêm da esquerda, cheias com o
     degradê, e as pares da direita, só com o contorno na cor do texto. Entram a cada 0,22 s com uma freada
     forte (curva expo) e saem na ordem inversa, para os lados de onde vieram. -->
<style>
.pilha{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;display:flex;flex-direction:column;align-items:center;
  font-family:Montserrat;font-weight:900;font-size:calc(var(--u)*13);line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.linha{white-space:nowrap;--lado:-1;
  background:linear-gradient(100deg,var(--cor-1),var(--cor-2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*.4) calc(var(--u)*1.4) rgba(0,0,0,.35));
  animation:entrar .7s cubic-bezier(.16,1,.3,1) calc(.1s + var(--i) * .22s) both,sair .45s cubic-bezier(.7,0,.84,0) calc(var(--dur) - .6s - var(--i) * .08s) forwards}
.linha:nth-child(even){--lado:1;background:none;-webkit-text-stroke:calc(var(--u)*.3) var(--cor-texto);filter:none}
@keyframes entrar{from{opacity:0;transform:translateX(calc(var(--lado) * 60vw))}}
@keyframes sair{to{opacity:0;transform:translateX(calc(var(--lado) * 60vw))}}
</style>
<div class="pilha">{{texto:linhas}}</div>
