<script type="application/json" id="modelo">
{
 "nome": "Tocando agora",
 "categoria": "tarjas",
 "motor": "canvas",
 "duracao": 6,
 "descricao": "Cartão de música: capa girando como um disco, nome da faixa e do artista, barras do equalizador e o progresso andando.",
 "campos": [
  {"id": "faixa", "rotulo": "Música", "tipo": "texto", "padrao": "Noite de Verão", "maximo": 32},
  {"id": "artista", "rotulo": "Artista", "tipo": "texto", "padrao": "Banda Horizonte", "maximo": 32},
  {"id": "cor_1", "rotulo": "Destaque (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Destaque (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Tocando agora: o cartão sobe no canto de baixo à esquerda; o disco (degradê com sulcos) gira sem parar,
     quatro barras de equalizador pulam ao lado do rótulo e a barra de progresso enche ao longo da duração. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const entra = TO.ease.outCubic(TO.prog(t, 0, 0.6));
    const sai = TO.ease.inCubic(TO.prog(t, dur - 0.5, dur));
    const cw = Math.min(W * 0.8, 70 * u);
    const ch = 18 * u;
    const x = 5 * u;
    const y = H - ch - 6 * u + (1 - entra) * 6 * u + sai * 4 * u;
    ctx.globalAlpha = entra * (1 - sai);
    ctx.fillStyle = "rgba(14,15,20,.9)";
    TO.retangulo(ctx, x, y, cw, ch, 2.4 * u);
    ctx.fill();
    // Disco
    const r = 6.4 * u;
    const dx = x + 2.4 * u + r;
    const dy = y + ch / 2;
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(t * 3);
    ctx.fillStyle = TO.degrade(ctx, -r, -r, r, r);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.25)";
    ctx.lineWidth = Math.max(1, 0.12 * u);
    for (let k = 1; k <= 4; k++) {
      ctx.beginPath();
      ctx.arc(0, 0, r * (0.4 + k * 0.13), 0.3, 2.4);
      ctx.stroke();
    }
    ctx.fillStyle = "#14151b";
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.18, 0, 6.2832);
    ctx.fill();
    ctx.restore();
    // Textos
    const tx = dx + r + 3 * u;
    const tw = x + cw - tx - 3 * u;
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillStyle = C.cor_1;
    ctx.font = TO.fonte(800, 2);
    ctx.letterSpacing = `${0.3 * u}px`;
    ctx.fillText("TOCANDO AGORA", tx + 4 * u, y + 2.6 * u);
    ctx.letterSpacing = "0px";
    for (let k = 0; k < 4; k++) {
      const h = (0.5 + Math.abs(Math.sin(t * (6 + k * 2.3) + k)) * 1.6) * u;
      ctx.fillRect(tx + k * 0.8 * u, y + 4.6 * u - h, 0.5 * u, h);
    }
    ctx.fillStyle = C.cor_texto;
    ctx.font = TO.fonte(800, TO.caber(ctx, C.faixa, 800, 3.6, tw));
    ctx.fillText(C.faixa, tx, y + 5.6 * u);
    ctx.globalAlpha = entra * (1 - sai) * 0.65;
    ctx.font = TO.fonte(500, TO.caber(ctx, C.artista, 500, 2.6, tw));
    ctx.fillText(C.artista, tx, y + 9.8 * u);
    // Progresso
    ctx.globalAlpha = entra * (1 - sai);
    const py = y + ch - 3.4 * u;
    ctx.fillStyle = "rgba(255,255,255,.15)";
    TO.retangulo(ctx, tx, py, tw, 0.6 * u, 0.3 * u);
    ctx.fill();
    const p = TO.clamp(0.08 + (t / dur) * 0.6);
    ctx.fillStyle = TO.degrade(ctx, tx, 0, tx + tw, 0);
    TO.retangulo(ctx, tx, py, tw * p, 0.6 * u, 0.3 * u);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(tx + tw * p, py + 0.3 * u, 0.8 * u, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;
  };
})();
</script>
