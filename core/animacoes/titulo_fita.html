<script type="application/json" id="modelo">
{
 "nome": "Título na fita",
 "categoria": "titulos",
 "motor": "css",
 "duracao": 4,
 "descricao": "Uma fita de tecido se desenrola da esquerda para a direita, com as pontas dobradas, e o título aparece escrito nela.",
 "campos": [
  {"id": "texto", "rotulo": "Título", "tipo": "texto", "padrao": "Inscrições abertas", "maximo": 28},
  {"id": "cor_1", "rotulo": "Fita", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Dobras", "tipo": "cor", "padrao": "#b8322a"},
  {"id": "cor_texto", "rotulo": "Cor do título", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Fita: o miolo é revelado por um clip-path que cresce da esquerda; as duas pontas (rabo de andorinha,
     na cor mais escura e um pouco abaixo, como se ficassem atrás) entram dobrando (rotateY) logo depois. O
     título entra letra a letra com um leve pulo. Na saída a fita se enrola de volta para a direita. -->
<style>
.fita{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;max-width:94%;
  animation:sair .5s ease-in calc(var(--dur) - .5s) forwards}
.miolo{position:relative;z-index:1;padding:calc(var(--u)*2.2) calc(var(--u)*5);background:var(--cor-1);color:var(--cor-texto);
  font-family:Montserrat;font-weight:800;font-size:calc(var(--u)*6.4);letter-spacing:-.01em;white-space:nowrap;
  box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2.4) rgba(0,0,0,.3);animation:abrir .7s cubic-bezier(.65,0,.35,1) .1s both}
.letra{display:inline-block;animation:letra .4s cubic-bezier(.3,1.6,.5,1) calc(.5s + var(--i) * .03s) both}
.ponta{width:calc(var(--u)*7);height:calc(var(--u)*9);background:var(--cor-2);margin-top:calc(var(--u)*3);flex:none;
  animation:dobrar .45s cubic-bezier(.2,.8,.2,1) .6s both}
.esq{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%);margin-right:calc(var(--u)*-2.5);transform-origin:100% 50%}
.dir{clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%);margin-left:calc(var(--u)*-2.5);transform-origin:0 50%}
@keyframes abrir{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes letra{from{opacity:0;transform:translateY(.4em)}}
@keyframes dobrar{from{opacity:0;transform:perspective(calc(var(--u)*40)) rotateY(90deg)}}
@keyframes sair{to{opacity:0;clip-path:inset(0 0 0 100%)}}
</style>
<div class="fita"><div class="ponta esq"></div><div class="miolo">{{texto:letras}}</div><div class="ponta dir"></div></div>
