<!-- Adesivo: o invólucro entra com mola e sai no fim; o desenho fica em laço pelo tempo que a pessoa escolher. -->
<style>
.adesivo{position:absolute;left:50%;top:50%;width:calc(var(--u)*46);height:calc(var(--u)*46);margin:calc(var(--u)*-23) 0 0 calc(var(--u)*-23);
  animation:entrar .55s cubic-bezier(.3,1.6,.5,1) both,sair .35s ease-in calc(var(--dur) - .35s) forwards}
.adesivo svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 calc(var(--u)*.8) calc(var(--u)*1.2) rgba(0,0,0,.35))}
:where(.adesivo svg *:not([transform])){transform-box:fill-box;transform-origin:center}
.c1{fill:var(--cor-1)}.c2{fill:var(--cor-2)}.ct{fill:var(--cor-texto)}.br{fill:#fff}
.tx{font-family:Montserrat;font-weight:900;text-anchor:middle;dominant-baseline:central}
@keyframes entrar{from{transform:scale(0) rotate(-25deg);opacity:0}}
@keyframes sair{to{transform:scale(0);opacity:0}}
.onda{animation:espalhar 1.2s ease-out infinite;opacity:0}@keyframes espalhar{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
</style>
