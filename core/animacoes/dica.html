<script type="application/json" id="modelo">
{
 "nome": "Dica com lâmpada",
 "categoria": "citacoes",
 "motor": "css",
 "duracao": 5,
 "descricao": "Uma lâmpada acende com brilho, o rótulo da dica aparece ao lado e o texto entra palavra por palavra.",
 "campos": [
  {"id": "rotulo", "rotulo": "Rótulo", "tipo": "texto", "padrao": "DICA DO DIA", "maximo": 20},
  {"id": "texto", "rotulo": "Texto", "tipo": "texto", "padrao": "Grave com a luz da janela na frente do rosto, nunca atrás.", "maximo": 120},
  {"id": "cor_1", "rotulo": "Luz", "tipo": "cor", "padrao": "#ffd166"},
  {"id": "cor_2", "rotulo": "Detalhe", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Dica: a lâmpada (SVG) entra apagada, pisca duas vezes e acende com um halo que respira; o cartão abre
     ao lado e as palavras do texto sobem em sequência. -->
<style>
.dica{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u)*3);width:min(calc(var(--u)*92),88%);
  color:var(--cor-texto);animation:sair .45s ease-in calc(var(--dur) - .45s) forwards}
.lampada{position:relative;flex:none;width:calc(var(--u)*15);height:calc(var(--u)*15);display:grid;place-items:center;animation:entrar .5s cubic-bezier(.2,1.5,.4,1) both}
.lampada::before{content:"";position:absolute;inset:calc(var(--u)*-2);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--cor-1) 60%,transparent),transparent);
  opacity:0;animation:halo .9s steps(1) .4s forwards,respirar 1.6s ease-in-out 1.3s infinite alternate}
.lampada svg{position:relative;width:70%;height:70%;fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:1.4;stroke-linejoin:round;animation:acender .9s steps(1) .4s forwards}
.cartao{flex:1;padding:calc(var(--u)*2.6) calc(var(--u)*3.2);border-radius:calc(var(--u)*2.4);background:rgba(14,15,20,.86);border-left:calc(var(--u)*.6) solid var(--cor-1);
  animation:abrir .5s cubic-bezier(.2,.8,.2,1) .8s both}
.rotulo{font-weight:800;font-size:calc(var(--u)*2.6);letter-spacing:.16em;color:var(--cor-1)}
.texto{margin-top:calc(var(--u)*1);font-weight:600;font-size:calc(var(--u)*3.8);line-height:1.3}
.palavra{display:inline-block;margin-right:.26em;animation:subir .4s ease-out calc(1.1s + var(--i) * .07s) both}
@keyframes entrar{from{opacity:0;transform:scale(.4)}}
@keyframes halo{0%{opacity:0}20%{opacity:1}35%{opacity:0}55%{opacity:1}70%{opacity:0}85%,100%{opacity:1}}
@keyframes acender{0%{fill:rgba(255,255,255,.18)}20%{fill:var(--cor-1)}35%{fill:rgba(255,255,255,.18)}55%{fill:var(--cor-1)}70%{fill:rgba(255,255,255,.18)}85%,100%{fill:var(--cor-1)}}
@keyframes respirar{from{transform:scale(.9)}to{transform:scale(1.1)}}
@keyframes abrir{from{opacity:0;transform:translateX(calc(var(--u)*-3))}}
@keyframes subir{from{opacity:0;transform:translateY(calc(var(--u)*1))}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-46%)}}
</style>
<div class="dica">
 <div class="lampada"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></div>
 <div class="cartao"><div class="rotulo">{{rotulo}}</div><div class="texto">{{texto:palavras}}</div></div>
</div>
