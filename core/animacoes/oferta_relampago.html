<script type="application/json" id="modelo">
{
 "nome": "Oferta relâmpago",
 "categoria": "chamadas",
 "motor": "canvas",
 "duracao": 5,
 "descricao": "Um cronômetro de horas, minutos e segundos correndo para trás, com a barra do estoque acabando e um raio piscando.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "OFERTA RELÂMPAGO", "maximo": 22},
  {"id": "horas", "rotulo": "Começa em (horas)", "tipo": "numero", "padrao": "2", "maximo": 0},
  {"id": "minutos", "rotulo": "Começa em (minutos)", "tipo": "numero", "padrao": "59", "maximo": 0},
  {"id": "estoque", "rotulo": "Estoque restante (%)", "tipo": "numero", "padrao": "18", "maximo": 0},
  {"id": "legenda", "rotulo": "Texto da barra", "tipo": "texto", "padrao": "restam poucas unidades", "maximo": 30},
  {"id": "cor_1", "rotulo": "Destaque (início)", "tipo": "cor", "padrao": "#ffd400"},
  {"id": "cor_2", "rotulo": "Destaque (fim)", "tipo": "cor", "padrao": "#ff7a00"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Relâmpago: o cronômetro parte de HH:MM:59 e desce um segundo a cada segundo do vídeo; cada dígito que
     muda cai de cima (meio segundo de troca). A barra do estoque desce de 100% até o valor e o raio do
     título pisca de vez em quando. Tudo vem só do tempo. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const inicio = (Math.min(99, parseInt(C.horas, 10) || 0) * 3600) + (Math.min(59, parseInt(C.minutos, 10) || 0) * 60) + 59;
  const estoque = Math.min(100, Math.max(0, parseInt(C.estoque, 10) || 0));
  const dois = (n) => String(n).padStart(2, "0");
  const texto = (s) => `${dois(Math.floor(s / 3600))}:${dois(Math.floor(s / 60) % 60)}:${dois(s % 60)}`;

  function raio(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x + 0.2 * s, y - 0.5 * s);
    ctx.lineTo(x - 0.25 * s, y + 0.08 * s);
    ctx.lineTo(x + 0.02 * s, y + 0.08 * s);
    ctx.lineTo(x - 0.15 * s, y + 0.5 * s);
    ctx.lineTo(x + 0.28 * s, y - 0.1 * s);
    ctx.lineTo(x + 0.02 * s, y - 0.1 * s);
    ctx.closePath();
    ctx.fill();
  }

  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const env = TO.envelope(t, 0.01, 0.45, dur);
    const k = TO.spring(t, 0.55, 2.2);
    const w = Math.min(W * 0.88, 86 * u);
    const h = 44 * u;
    ctx.save();
    ctx.globalAlpha = env;
    ctx.translate(W / 2, H / 2);
    ctx.scale(0.85 + 0.15 * k, 0.85 + 0.15 * k);
    ctx.globalAlpha = env * TO.clamp(k * 1.5);
    TO.retangulo(ctx, -w / 2, -h / 2, w, h, 3.4 * u);
    ctx.fillStyle = "rgba(14,15,20,.9)";
    ctx.fill();
    // Título com o raio
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const pisca = Math.floor(t * 4) % 7 === 0 ? 0.35 : 1;
    ctx.fillStyle = TO.degrade(ctx, -w / 2, 0, w / 2, 0);
    ctx.font = TO.fonte(900, TO.caber(ctx, C.titulo, 900, 6, w - 22 * u, "Montserrat"), "Montserrat");
    const tw = ctx.measureText(C.titulo).width;
    ctx.fillText(C.titulo, 3 * u, -13 * u);
    ctx.globalAlpha = env * pisca;
    raio(-tw / 2 - 2 * u, -13 * u, 7 * u);
    ctx.globalAlpha = env;
    // Cronômetro: cada caractere numa casa fixa, para os dígitos não dançarem
    const agora = Math.max(0, inicio - Math.floor(t));
    const antes = Math.max(0, inicio - Math.floor(t) + 1);
    const troca = TO.ease.outCubic(TO.clamp((t % 1) / 0.35));
    const novo = texto(agora);
    const velho = texto(antes);
    ctx.font = TO.fonte(800, 11, "Montserrat");
    const casa = 7.6 * u;
    const x0 = -casa * 3.5;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-w / 2, -7.5 * u, w, 15 * u);
    ctx.clip();
    for (let i = 0; i < 8; i++) {
      const x = x0 + i * casa + (i > 2 ? 0 : 0);
      ctx.fillStyle = C.cor_texto;
      if (novo[i] !== velho[i] && t >= 1) {
        ctx.globalAlpha = env * troca;
        ctx.fillText(novo[i], x, (troca - 1) * 9 * u);
        ctx.globalAlpha = env * (1 - troca);
        ctx.fillText(velho[i], x, troca * 9 * u);
      } else {
        ctx.globalAlpha = env;
        ctx.fillText(novo[i], x, 0);
      }
    }
    ctx.restore();
    ctx.globalAlpha = env;
    // Barra do estoque
    const bw = w - 14 * u;
    const nivel = 100 - (100 - estoque) * TO.ease.inOutCubic(TO.prog(t, 0.6, 2.4));
    TO.retangulo(ctx, -bw / 2, 11 * u, bw, 2.6 * u, 1.3 * u);
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fill();
    TO.retangulo(ctx, -bw / 2, 11 * u, Math.max(2.6 * u, (bw * nivel) / 100), 2.6 * u, 1.3 * u);
    ctx.fillStyle = TO.degrade(ctx, -bw / 2, 0, bw / 2, 0);
    ctx.fill();
    ctx.fillStyle = C.cor_texto;
    ctx.font = TO.fonte(600, TO.caber(ctx, `${C.legenda} · ${Math.round(nivel)}%`, 600, 3.2, bw));
    ctx.fillText(`${C.legenda} · ${Math.round(nivel)}%`, 0, 17.6 * u);
    ctx.restore();
  };
})();
</script>
