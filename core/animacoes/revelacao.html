<script type="application/json" id="modelo">
{
 "nome": "Revelação de nome",
 "categoria": "titulos",
 "motor": "css",
 "duracao": 3.5,
 "descricao": "Um bloco de cor atravessa e revela o nome, com uma linha embaixo.",
 "campos": [
  {
   "id": "texto",
   "rotulo": "Nome",
   "tipo": "texto",
   "padrao": "TakeOne",
   "maximo": 30
  },
  {
   "id": "subtitulo",
   "rotulo": "Linha de baixo",
   "tipo": "texto",
   "padrao": "Edite melhor. Conte mais.",
   "maximo": 60
  },
  {
   "id": "cor_1",
   "rotulo": "Cor do bloco (início)",
   "tipo": "cor",
   "padrao": "#ff624a"
  },
  {
   "id": "cor_2",
   "rotulo": "Cor do bloco (fim)",
   "tipo": "cor",
   "padrao": "#ff3478"
  },
  {
   "id": "cor_texto",
   "rotulo": "Cor do texto",
   "tipo": "cor",
   "padrao": "#ffffff"
  }
 ]
}
</script>
<!-- Revelação de nome: um bloco de cor cresce, encolhe para a direita e deixa o nome; a linha de baixo vem depois -->
<style>
.revelacao{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u)*2);animation:sair .5s ease-in calc(var(--dur) - .5s) forwards}
.caixa{position:relative;padding:0 calc(var(--u)*2)}
.nome{display:block;color:var(--cor-texto);font-weight:800;font-size:calc(var(--u)*12);line-height:1.1;letter-spacing:-.045em;
  clip-path:inset(0 100% 0 0);animation:mostrar .01s linear .5s forwards}
.bloco{position:absolute;inset:0;background:linear-gradient(110deg,var(--cor-1),var(--cor-2));border-radius:calc(var(--u)*.8);
  transform:scaleX(0);animation:bloco 1s cubic-bezier(.7,0,.3,1) both}
.sub{color:var(--cor-texto);font-weight:500;font-size:calc(var(--u)*3.6);opacity:0;letter-spacing:.01em;
  animation:subir .6s cubic-bezier(.2,.8,.2,1) .9s forwards}
@keyframes bloco{0%{transform:scaleX(0);transform-origin:0 50%}50%{transform:scaleX(1);transform-origin:0 50%}
  50.01%{transform:scaleX(1);transform-origin:100% 50%}100%{transform:scaleX(0);transform-origin:100% 50%}}
@keyframes mostrar{to{clip-path:inset(0 0 0 0)}}
@keyframes subir{from{opacity:0;transform:translateY(calc(var(--u)*2))}to{opacity:.9;transform:none}}
@keyframes sair{to{opacity:0}}
</style>
<div class="revelacao"><div class="caixa"><span class="nome">{{texto}}</span><div class="bloco"></div></div>
<div class="sub">{{subtitulo}}</div></div>
