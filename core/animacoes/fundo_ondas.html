<script type="application/json" id="modelo">
{
 "nome": "Fundo de ondas",
 "categoria": "fundos",
 "motor": "canvas",
 "duracao": 6,
 "tela_cheia": true,
 "descricao": "Fundo em tela cheia com ondas de cor se movendo devagar e um título no centro. Bom para abertura ou capa.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "Novidades da semana", "maximo": 40},
  {"id": "cor_1", "rotulo": "Ondas (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Ondas (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Ondas: fundo escuro e cinco ondas (soma de dois senos cada) empilhadas embaixo, cada uma mais clara e
     mais lenta que a de trás, numa cor entre as duas do degradê. O título sobe e fica, e o fundo inteiro
     some no fim. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const N = 5;
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = TO.envelope(t, 0.4, 0.5, dur);
    const fundo = ctx.createLinearGradient(0, 0, 0, H);
    fundo.addColorStop(0, "#0a0b10");
    fundo.addColorStop(1, "#16121a");
    ctx.fillStyle = fundo;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      const base = H * (0.5 + i * 0.09);
      const amp = H * (0.06 - i * 0.008);
      const vel = 0.6 - i * 0.08;
      ctx.globalAlpha = TO.envelope(t, 0.4, 0.5, dur) * (0.18 + i * 0.14);
      ctx.fillStyle = TO.mix(C.cor_1, C.cor_2, i / (N - 1));
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += W / 80) {
        const q = x / W;
        const y = base + amp * Math.sin(q * 6.2832 * (1.2 + i * 0.15) + t * vel * 2 + i * 1.7) + amp * 0.4 * Math.sin(q * 6.2832 * 2.7 - t * vel * 1.3 + i);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    const k = TO.ease.outCubic(TO.prog(t, 0.4, 1.2));
    ctx.globalAlpha = TO.envelope(t, 0.4, 0.5, dur) * k;
    ctx.fillStyle = C.cor_texto;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = TO.fonte(900, TO.caber(ctx, C.titulo, 900, 9, W * 0.82));
    ctx.fillText(C.titulo, W / 2, H * 0.36 + (1 - k) * 3 * u);
    ctx.globalAlpha = 1;
  };
})();
</script>
