<script type="application/json" id="modelo">
{
 "nome": "Marca com brilho",
 "categoria": "logos",
 "motor": "css",
 "duracao": 4,
 "descricao": "O nome da marca surge do desfoque, um brilho atravessa as letras como em metal polido e o slogan aparece embaixo.",
 "campos": [
  {"id": "texto", "rotulo": "Nome da marca", "tipo": "texto", "padrao": "AURUM", "maximo": 18},
  {"id": "slogan", "rotulo": "Slogan (opcional)", "tipo": "texto", "padrao": "joias que contam histórias", "maximo": 40},
  {"id": "cor_1", "rotulo": "Letras (claro)", "tipo": "cor", "padrao": "#fff1c9"},
  {"id": "cor_2", "rotulo": "Letras (escuro)", "tipo": "cor", "padrao": "#c9973f"},
  {"id": "cor_texto", "rotulo": "Cor do slogan", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Brilho: as letras são um degradê vertical entre as duas cores (como metal) e ganham uma faixa branca em
     diagonal que atravessa da esquerda para a direita, duas vezes (a segunda mais fraca). Tudo é a mesma
     camada de texto com dois fundos recortados pelas letras (background-clip:text). -->
<style>
.marca{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);
  animation:sair .5s ease-in calc(var(--dur) - .5s) forwards}
.nome{font-family:Montserrat;font-weight:900;font-size:calc(var(--u)*15);line-height:1;letter-spacing:.08em;text-align:center;text-wrap:balance;padding:0 .04em;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) -150% 0/200% 100% no-repeat,
    linear-gradient(180deg,var(--cor-1),var(--cor-2) 55%,var(--cor-1));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 calc(var(--u)*.5) calc(var(--u)*1.5) rgba(0,0,0,.45));
  animation:surgir .9s cubic-bezier(.2,.8,.2,1) both,brilho 1.1s cubic-bezier(.45,0,.55,1) .8s both}
.slogan{font-weight:500;font-size:calc(var(--u)*3.6);letter-spacing:.24em;text-transform:uppercase;text-align:center;color:var(--cor-texto);opacity:.88;
  text-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(0,0,0,.5);animation:aparecer .7s ease-out 1.3s both}
.slogan:empty{display:none}
@keyframes surgir{from{opacity:0;filter:blur(calc(var(--u)*2)) drop-shadow(0 0 0 transparent);letter-spacing:.3em}}
@keyframes brilho{from{background-position:-150% 0,0 0}to{background-position:250% 0,0 0}}
@keyframes aparecer{from{opacity:0;letter-spacing:.5em}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
</style>
<div class="marca"><div class="nome">{{texto}}</div><div class="slogan">{{slogan}}</div></div>
