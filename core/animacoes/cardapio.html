<script type="application/json" id="modelo">
{
 "nome": "Cardápio com preços",
 "categoria": "listas",
 "motor": "css",
 "duracao": 6,
 "descricao": "Itens de cardápio entram um a um, com o nome, uma linha pontilhada que corre e o preço no fim.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "Menu do dia", "maximo": 30},
  {"id": "texto", "rotulo": "Itens (Nome: preço, um por linha)", "tipo": "linhas", "padrao": "Feijoada completa: R$ 42\nMoqueca de peixe: R$ 58\nRisoto de cogumelos: R$ 46\nPudim da casa: R$ 14", "maximo": 260},
  {"id": "cor_1", "rotulo": "Preços", "tipo": "cor", "padrao": "#ffb547"},
  {"id": "cor_2", "rotulo": "Detalhe", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Cardápio: um pequeno script separa "Nome: preço" de cada linha em dois spans (o texto já vem escapado
     do servidor); o pontilhado entre eles é um flex com borda pontilhada que cresce da esquerda, e o preço
     estala no fim da linha. -->
<style>
.menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(var(--u)*82),88%);padding:calc(var(--u)*4) calc(var(--u)*4.4);
  border-radius:calc(var(--u)*2.6);background:rgba(16,13,12,.88);color:var(--cor-texto);
  animation:abrir .6s cubic-bezier(.2,.8,.2,1) both,sair .45s ease-in calc(var(--dur) - .45s) forwards}
.titulo{font-family:Caveat,cursive;font-weight:600;font-size:calc(var(--u)*8);color:var(--cor-1);text-align:center;line-height:1;margin-bottom:calc(var(--u)*1.6)}
.titulo::after{content:"";display:block;width:calc(var(--u)*14);height:calc(var(--u)*.3);margin:calc(var(--u)*1) auto 0;background:var(--cor-2);
  transform-origin:50% 50%;animation:crescer .6s ease-out .4s both}
.linha{display:flex;align-items:baseline;gap:calc(var(--u)*1.2);margin:calc(var(--u)*1.6) 0;font-weight:600;font-size:calc(var(--u)*3.6);
  animation:entrar .45s ease-out calc(.6s + var(--i) * .45s) both}
.linha .pontos{flex:1;border-bottom:calc(var(--u)*.35) dotted rgba(255,255,255,.4);transform-origin:0 50%;animation:crescer .5s ease-out calc(.8s + var(--i) * .45s) both}
.linha .preco{font-weight:800;color:var(--cor-1);white-space:nowrap;animation:estalo .4s cubic-bezier(.2,1.6,.4,1) calc(1.1s + var(--i) * .45s) both}
@keyframes abrir{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes crescer{from{transform:scaleX(0)}}
@keyframes entrar{from{opacity:0;transform:translateX(calc(var(--u)*-2))}}
@keyframes estalo{from{opacity:0;transform:scale(.4)}}
@keyframes sair{to{opacity:0}}
</style>
<div class="menu"><div class="titulo">{{titulo}}</div><div class="itens">{{texto:linhas}}</div></div>
<script>
for (const linha of document.querySelectorAll(".itens .linha")) {
  const texto = linha.textContent;
  const i = texto.lastIndexOf(":");
  const nome = document.createElement("span");
  nome.textContent = i < 0 ? texto : texto.slice(0, i).trim();
  const pontos = document.createElement("span");
  pontos.className = "pontos";
  const preco = document.createElement("span");
  preco.className = "preco";
  preco.textContent = i < 0 ? "" : texto.slice(i + 1).trim();
  linha.replaceChildren(nome, pontos, preco);
}
</script>
