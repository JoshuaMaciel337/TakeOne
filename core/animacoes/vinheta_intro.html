<script type="application/json" id="modelo">
{
 "nome": "Vinheta de abertura",
 "categoria": "transicoes",
 "motor": "canvas",
 "duracao": 3.2,
 "tela_cheia": true,
 "descricao": "Abertura em tela cheia: fundo escuro, título que acende entre duas linhas e uma cortina que revela o vídeo.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "EPISÓDIO 12", "maximo": 30},
  {"id": "subtitulo", "rotulo": "Subtítulo", "tipo": "texto", "padrao": "Como começar do zero", "maximo": 50},
  {"id": "cor_1", "rotulo": "Destaque (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Destaque (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Vinheta: o quadro começa coberto por um fundo escuro com um brilho do degradê respirando ao fundo;
     duas linhas correm para o centro, o título abre entre elas e o subtítulo sobe. No fim, o fundo se
     divide ao meio (metade de cima sobe, de baixo desce) e revela o vídeo. Ponha no começo do vídeo. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const cena = document.createElement("canvas");
  cena.width = W;
  cena.height = H;
  const c2 = cena.getContext("2d");
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    // A cena inteira num canvas separado, depois dividida em duas metades
    c2.globalAlpha = 1;
    c2.fillStyle = "#0b0c10";
    c2.fillRect(0, 0, W, H);
    const pulso = 0.5 + 0.5 * Math.sin(t * 2.4);
    const s = Math.max(W, H) * (0.55 + 0.08 * pulso);
    c2.globalAlpha = 0.35;
    c2.drawImage(TO.brilho(C.cor_1), W * 0.3 - s / 2, H * 0.45 - s / 2, s, s);
    c2.drawImage(TO.brilho(C.cor_2), W * 0.7 - s / 2, H * 0.55 - s / 2, s, s);
    c2.globalAlpha = 1;
    const cx = W / 2;
    const cy = H / 2;
    const tam = TO.caber(c2, C.titulo, 900, 10, W * 0.82);
    const meia = tam * u * 0.85;
    const linhas = TO.ease.outExpo(TO.prog(t, 0.15, 0.9));
    c2.fillStyle = TO.degrade(c2, 0, 0, W, 0);
    const lw = W * 0.7 * linhas;
    c2.fillRect(cx - lw / 2, cy - meia - 1.2 * u, lw, 0.35 * u);
    c2.fillRect(cx - lw / 2, cy + meia + 0.8 * u, lw, 0.35 * u);
    const abre = TO.ease.outExpo(TO.prog(t, 0.5, 1.3));
    c2.save();
    c2.beginPath();
    c2.rect(0, cy - meia * abre, W, meia * 2 * abre);
    c2.clip();
    c2.fillStyle = C.cor_texto;
    c2.textAlign = "center";
    c2.textBaseline = "middle";
    c2.font = TO.fonte(900, tam);
    c2.letterSpacing = `${(1 - abre) * 1.5 * u + 0.02 * tam * u}px`;
    c2.fillText(C.titulo, cx, cy + 0.4 * u);
    c2.letterSpacing = "0px";
    c2.restore();
    const sub = TO.ease.outCubic(TO.prog(t, 1, 1.6));
    c2.globalAlpha = sub * 0.85;
    c2.fillStyle = C.cor_texto;
    c2.textAlign = "center";
    c2.textBaseline = "top";
    c2.font = TO.fonte(500, Math.min(3.8, TO.caber(c2, C.subtitulo, 500, 3.8, W * 0.8)));
    c2.fillText(C.subtitulo, cx, cy + meia + 3.5 * u + (1 - sub) * 2 * u);
    c2.globalAlpha = 1;
    // Abertura: as metades se afastam
    const k = TO.ease.inOutCubic(TO.prog(t, dur - 0.8, dur));
    const d = k * H * 0.52;
    ctx.drawImage(cena, 0, 0, W, H / 2, 0, -d, W, H / 2);
    ctx.drawImage(cena, 0, H / 2, W, H / 2, 0, H / 2 + d, W, H / 2);
  };
})();
</script>
