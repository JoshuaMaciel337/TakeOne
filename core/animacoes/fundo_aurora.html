<script type="application/json" id="modelo">
{
 "nome": "Aurora",
 "categoria": "fundos",
 "motor": "canvas",
 "duracao": 6,
 "tela_cheia": true,
 "descricao": "Fundo em tela cheia com manchas de luz coloridas que se movem devagar, como uma aurora, e um título no centro.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "Uma nova fase", "maximo": 30},
  {"id": "subtitulo", "rotulo": "Subtítulo (opcional)", "tipo": "texto", "padrao": "começa agora", "maximo": 40},
  {"id": "cor_1", "rotulo": "Luz 1", "tipo": "cor", "padrao": "#9b8cff"},
  {"id": "cor_2", "rotulo": "Luz 2", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Aurora: fundo quase preto e cinco manchas grandes (o carimbo de brilho do comum.js, esticado) que
     andam em órbitas lentas de Lissajous, somadas com "lighter". O título aparece com desfoque que some. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const cores = [C.cor_1, C.cor_2, C.cor_1, "#6bd8f2", C.cor_2];
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const env = TO.envelope(t, 0.6, 0.6, dur);
    ctx.globalAlpha = env;
    ctx.fillStyle = "#07070c";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    cores.forEach((cor, i) => {
      const x = W * (0.5 + 0.35 * Math.sin(t * (0.25 + i * 0.07) + i * 1.3));
      const y = H * (0.5 + 0.3 * Math.cos(t * (0.2 + i * 0.05) + i * 2.1));
      const r = Math.max(W, H) * (0.45 + 0.08 * Math.sin(t * 0.5 + i));
      ctx.globalAlpha = env * 0.45;
      ctx.drawImage(TO.brilho(cor), x - r, y - r * 0.7, r * 2, r * 1.4);
    });
    ctx.globalCompositeOperation = "source-over";
    const k = TO.ease.outCubic(TO.prog(t, 0.5, 1.6));
    ctx.save();
    ctx.globalAlpha = env * k;
    ctx.filter = k < 1 ? `blur(${(1 - k) * 1.5 * u}px)` : "none";
    ctx.fillStyle = C.cor_texto;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = TO.fonte(800, TO.caber(ctx, C.titulo, 800, 10, W * 0.84));
    ctx.fillText(C.titulo, W / 2, H / 2 - (C.subtitulo ? 3 * u : 0));
    ctx.restore();
    if (C.subtitulo) {
      const s = TO.ease.outCubic(TO.prog(t, 1.2, 2));
      ctx.globalAlpha = env * s * 0.85;
      ctx.fillStyle = C.cor_texto;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = TO.fonte(400, Math.min(4, TO.caber(ctx, C.subtitulo, 400, 4, W * 0.8)));
      ctx.letterSpacing = `${0.4 * u}px`;
      ctx.fillText(C.subtitulo, W / 2, H / 2 + 7 * u);
      ctx.letterSpacing = "0px";
    }
    ctx.globalAlpha = 1;
  };
})();
</script>
