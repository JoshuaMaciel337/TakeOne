<script type="application/json" id="modelo">
{
 "nome": "Salve para depois",
 "categoria": "redes",
 "motor": "css",
 "duracao": 4,
 "descricao": "O ícone de salvar se enche de cor com um toque e a chamada aparece ao lado.",
 "campos": [
  {"id": "texto", "rotulo": "Chamada", "tipo": "texto", "padrao": "Salve para não esquecer", "maximo": 30},
  {"id": "subtitulo", "rotulo": "Linha de baixo (opcional)", "tipo": "texto", "padrao": "e mande para quem precisa", "maximo": 36},
  {"id": "cor_1", "rotulo": "Ícone (início)", "tipo": "cor", "padrao": "#ffd25a"},
  {"id": "cor_2", "rotulo": "Ícone (fim)", "tipo": "cor", "padrao": "#ffa62b"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Salvar: o marcador de página (desenhado em SVG) entra vazio; um círculo de toque se abre sobre ele aos
     0,9 s, o marcador afunda e volta cheio de cor (o preenchimento sobe de baixo para cima por um retângulo
     dentro da máscara do desenho), com pequenos raios saindo em volta. -->
<style>
.chamada{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:calc(var(--u)*3);width:max-content;max-width:90%;
  padding:calc(var(--u)*2.4) calc(var(--u)*4) calc(var(--u)*2.4) calc(var(--u)*2.6);border-radius:calc(var(--u)*3);background:rgba(14,15,20,.88);color:var(--cor-texto);
  animation:entrar .6s cubic-bezier(.3,1.4,.5,1) both,sair .45s ease-in calc(var(--dur) - .45s) forwards}
.icone{position:relative;flex:none;width:calc(var(--u)*12);height:calc(var(--u)*12)}
.icone svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.marcador{transform-origin:50% 50%;transform-box:fill-box;animation:afundar .35s ease-in-out .85s both}
.cheio{transform:translateY(100%);animation:encher .4s cubic-bezier(.2,.8,.2,1) .95s both}
.toque{position:absolute;left:50%;top:50%;width:calc(var(--u)*14);height:calc(var(--u)*14);margin:calc(var(--u)*-7) 0 0 calc(var(--u)*-7);border-radius:50%;
  background:rgba(255,255,255,.35);opacity:0;animation:toque .6s ease-out .8s both}
.raio{stroke:var(--cor-1);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:3 9;stroke-dashoffset:3;animation:raio .5s ease-out 1.15s both}
.textos{display:flex;flex-direction:column;gap:calc(var(--u)*.6);min-width:0}
.texto{font-weight:800;font-size:calc(var(--u)*5.8);letter-spacing:-.02em;animation:texto .5s cubic-bezier(.2,.8,.2,1) .3s both}
.sub{font-weight:500;font-size:calc(var(--u)*3.7);opacity:.8;animation:texto .5s ease-out .5s both}
.sub:empty{display:none}
@keyframes afundar{50%{transform:scale(.8)}}
@keyframes encher{to{transform:translateY(0)}}
@keyframes toque{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.3)}}
@keyframes raio{from{stroke-dashoffset:3}to{stroke-dashoffset:-9}}
@keyframes texto{from{opacity:0;transform:translateX(calc(var(--u)*-2))}}
@keyframes entrar{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-46%)}}
</style>
<div class="chamada"><div class="icone"><div class="toque"></div>
<svg viewBox="0 0 24 24"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--cor-1)"/><stop offset="1" style="stop-color:var(--cor-2)"/></linearGradient>
<clipPath id="forma"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.6L5 21V4a1 1 0 0 1 1-1z"/></clipPath></defs>
<g class="raio"><path d="M12 -2.5V-.5M3 1l1.4 1.4M21 1l-1.4 1.4M-1.5 9h2M25.5 9h-2"/></g>
<g class="marcador"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.6L5 21V4a1 1 0 0 1 1-1z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
<g clip-path="url(#forma)"><rect class="cheio" x="4" y="2" width="16" height="20" fill="url(#dg)"/></g></g></svg></div>
<div class="textos"><div class="texto">{{texto}}</div><div class="sub">{{subtitulo}}</div></div></div>
