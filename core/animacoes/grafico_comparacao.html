<script type="application/json" id="modelo">
{
 "nome": "Comparação em barras",
 "categoria": "numeros",
 "motor": "css",
 "duracao": 5,
 "descricao": "Duas barras horizontais crescem até as porcentagens, uma apagada e outra em destaque, com os números contando.",
 "campos": [
  {"id": "titulo", "rotulo": "Título", "tipo": "texto", "padrao": "Taxa de conversão", "maximo": 36},
  {"id": "rotulo_1", "rotulo": "Barra 1", "tipo": "texto", "padrao": "Antes do curso", "maximo": 22},
  {"id": "valor_1", "rotulo": "Valor 1 (%)", "tipo": "numero", "padrao": "32", "maximo": 0},
  {"id": "rotulo_2", "rotulo": "Barra 2", "tipo": "texto", "padrao": "Depois do curso", "maximo": 22},
  {"id": "valor_2", "rotulo": "Valor 2 (%)", "tipo": "numero", "padrao": "78", "maximo": 0},
  {"id": "cor_1", "rotulo": "Destaque (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Destaque (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Comparação: o comprimento de cada barra é a porcentagem (limitada a 100 pelo min()) e os números contam
     pelo contador do CSS (@property inteira, como no "Número que conta"). A primeira barra é cinza; a
     segunda, em degradê, cresce depois e ganha um brilho que passa por ela no fim. -->
<style>
@property --n1{syntax:'<integer>';inherits:false;initial-value:0}
@property --n2{syntax:'<integer>';inherits:false;initial-value:0}
.quadro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(var(--u)*84),88%);padding:calc(var(--u)*3.4);border-radius:calc(var(--u)*3);
  background:rgba(14,15,20,.86);color:var(--cor-texto);display:flex;flex-direction:column;gap:calc(var(--u)*2.4);
  animation:entrar .6s cubic-bezier(.2,.8,.2,1) both,sair .45s ease-in calc(var(--dur) - .45s) forwards}
.titulo{font-weight:800;font-size:calc(var(--u)*5.2);letter-spacing:-.02em}
.item{display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.topo{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:calc(var(--u)*3.6)}
.num{font-family:Montserrat;font-weight:800;font-size:calc(var(--u)*5)}
.num::after{content:counter(n) "%"}
.i1 .num{counter-reset:n var(--n1);animation:conta1 1.2s cubic-bezier(.2,.7,.2,1) .5s both;opacity:.7}
.i2 .num{counter-reset:n var(--n2);animation:conta2 1.4s cubic-bezier(.2,.7,.2,1) 1s both}
.trilho{height:calc(var(--u)*3.2);border-radius:calc(var(--u)*1.6);background:rgba(255,255,255,.12);overflow:hidden}
.barra{position:relative;height:100%;border-radius:inherit;transform-origin:0 50%;overflow:hidden}
.i1 .barra{width:min({{valor_1}}%,100%);background:rgba(255,255,255,.45);animation:crescer 1.2s cubic-bezier(.2,.7,.2,1) .5s both}
.i2 .barra{width:min({{valor_2}}%,100%);background:linear-gradient(90deg,var(--cor-1),var(--cor-2));animation:crescer 1.4s cubic-bezier(.2,.7,.2,1) 1s both}
.i2 .barra::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%) -200% 0/50% 100% no-repeat;
  animation:brilho .9s ease-in-out 2.5s both}
@keyframes crescer{from{transform:scaleX(0)}}
@keyframes conta1{from{--n1:0}to{--n1:{{valor_1}}}}
@keyframes conta2{from{--n2:0}to{--n2:{{valor_2}}}}
@keyframes brilho{to{background-position:300% 0}}
@keyframes entrar{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-47%)}}
</style>
<div class="quadro"><div class="titulo">{{titulo}}</div>
<div class="item i1"><div class="topo"><span>{{rotulo_1}}</span><span class="num"></span></div><div class="trilho"><div class="barra"></div></div></div>
<div class="item i2"><div class="topo"><span>{{rotulo_2}}</span><span class="num"></span></div><div class="trilho"><div class="barra"></div></div></div></div>
