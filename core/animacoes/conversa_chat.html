<script type="application/json" id="modelo">
{
 "nome": "Conversa de mensagens",
 "categoria": "redes",
 "motor": "css",
 "duracao": 7,
 "descricao": "Balões de conversa aparecem um a um, alternando os lados, cada um depois dos três pontinhos de digitando.",
 "campos": [
  {"id": "texto", "rotulo": "Mensagens (uma por linha, alternando quem fala)", "tipo": "linhas", "padrao": "Oi! Vocês ainda têm o tênis azul?\nTemos sim! Qual número?\n38. Dá para entregar hoje?\nDá! Chega até as 18h.", "maximo": 260},
  {"id": "cor_1", "rotulo": "Balão da direita (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Balão da direita (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Conversa: cada linha é uma mensagem; as ímpares ficam à esquerda (cinza) e as pares à direita (degradê).
     Cada balão nasce coberto pelos três pontos de "digitando" (um ::before com o mesmo fundo), que somem
     0,9 s depois e mostram o texto. -->
<style>
.conversa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(var(--u)*80),86%);display:flex;flex-direction:column;
  gap:calc(var(--u)*1.6);animation:sair .45s ease-in calc(var(--dur) - .45s) forwards}
.linha{position:relative;max-width:78%;padding:calc(var(--u)*2) calc(var(--u)*2.8);border-radius:calc(var(--u)*3);font-weight:500;font-size:calc(var(--u)*3.6);
  line-height:1.3;color:var(--cor-texto);align-self:flex-start;background:rgba(40,42,52,.95);border-bottom-left-radius:calc(var(--u)*.8);
  animation:balao .4s cubic-bezier(.2,1.4,.4,1) calc(var(--i) * 1.3s) both}
.linha:nth-child(even){align-self:flex-end;background:linear-gradient(120deg,var(--cor-1),var(--cor-2));border-bottom-left-radius:calc(var(--u)*3);border-bottom-right-radius:calc(var(--u)*.8)}
.linha::before{content:"• • •";position:absolute;inset:0;padding:calc(var(--u)*2) calc(var(--u)*2.8);border-radius:inherit;background:inherit;
  font-weight:900;letter-spacing:.1em;white-space:nowrap;animation:digitando .9s steps(1) calc(var(--i) * 1.3s) both}
@keyframes balao{from{opacity:0;transform:scale(.6) translateY(calc(var(--u)*2))}}
@keyframes digitando{0%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-46%)}}
</style>
<div class="conversa">{{texto:linhas}}</div>
