<script type="application/json" id="modelo">
{
 "nome": "Clique no botão",
 "categoria": "chamadas",
 "motor": "css",
 "duracao": 4.5,
 "descricao": "Um botão aparece, a setinha do mouse vem até ele e clica: o botão afunda, solta uma onda e troca o texto.",
 "campos": [
  {"id": "texto", "rotulo": "Botão", "tipo": "texto", "padrao": "Comprar agora", "maximo": 22},
  {"id": "depois", "rotulo": "Botão depois do clique", "tipo": "texto", "padrao": "Adicionado ✓", "maximo": 22},
  {"id": "subtitulo", "rotulo": "Linha de baixo (opcional)", "tipo": "texto", "padrao": "frete grátis para todo o Brasil", "maximo": 40},
  {"id": "cor_1", "rotulo": "Botão (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Botão (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Clique: o botão entra com mola; a seta (SVG) vem de baixo à direita numa curva (duas animações, uma em
     x e outra em y, com curvas diferentes) e para no meio do botão aos 1,5 s; aí a seta e o botão afundam
     juntos, uma onda clara se abre do ponto do clique e o texto troca (os dois rótulos empilhados). -->
<style>
.chamada{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);width:90%;
  color:var(--cor-texto);animation:sair .45s ease-in calc(var(--dur) - .45s) forwards}
.botao{position:relative;display:grid;place-items:center;overflow:hidden;padding:calc(var(--u)*2.6) calc(var(--u)*7);border-radius:999px;
  background:linear-gradient(110deg,var(--cor-1),var(--cor-2));font-weight:800;font-size:calc(var(--u)*5.4);white-space:nowrap;
  box-shadow:0 calc(var(--u)*1) calc(var(--u)*3.4) rgba(0,0,0,.35);animation:entrar .6s cubic-bezier(.3,1.5,.5,1) both,apertar .3s ease-in-out 1.5s both}
.botao span{grid-area:1/1}
.antes{animation:some .15s linear 1.62s both}
.depois{opacity:0;animation:aparece .2s linear 1.66s both}
.onda{position:absolute;left:50%;top:50%;width:calc(var(--u)*60);height:calc(var(--u)*60);margin:calc(var(--u)*-30) 0 0 calc(var(--u)*-30);border-radius:50%;
  background:rgba(255,255,255,.45);transform:scale(0);opacity:0;animation:onda .7s ease-out 1.6s both}
.mouse{position:absolute;left:50%;top:50%;width:calc(var(--u)*7);height:calc(var(--u)*7);margin:calc(var(--u)*-1) 0 0 calc(var(--u)*-1);
  filter:drop-shadow(0 calc(var(--u)*.3) calc(var(--u)*.8) rgba(0,0,0,.5));animation:vir_x 1s cubic-bezier(.3,.1,.2,1) .5s both}
.mouse svg{width:100%;height:100%;animation:vir_y 1s cubic-bezier(.6,0,.3,1) .5s both,clicar .3s ease-in-out 1.5s both}
.alvo{position:relative}
.sub{font-weight:600;font-size:calc(var(--u)*3.4);text-align:center;text-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(0,0,0,.6);animation:some_in .5s ease-out 1.9s both}
.sub:empty{display:none}
@keyframes vir_x{from{transform:translateX(calc(var(--u)*30))}}
@keyframes vir_y{from{transform:translateY(calc(var(--u)*24))}}
@keyframes clicar{50%{transform:scale(.82)}}
@keyframes apertar{50%{transform:scale(.94)}}
@keyframes onda{0%{transform:scale(0);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes some{to{opacity:0}}
@keyframes aparece{to{opacity:1}}
@keyframes some_in{from{opacity:0;transform:translateY(calc(var(--u)*1.5))}}
@keyframes entrar{from{opacity:0;transform:scale(.6)}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-46%)}}
</style>
<div class="chamada"><div class="alvo"><div class="botao"><i class="onda"></i><span class="antes">{{texto}}</span><span class="depois">{{depois}}</span></div>
<div class="mouse"><svg viewBox="0 0 24 24"><path d="M4 2.5l15 11.2-6.6.9 3.9 6.9-2.7 1.5-3.9-6.9L5 20.6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div></div>
<div class="sub">{{subtitulo}}</div></div>
