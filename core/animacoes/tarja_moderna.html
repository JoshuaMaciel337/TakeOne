<script type="application/json" id="modelo">
{
 "nome": "Tarja com etiqueta",
 "categoria": "tarjas",
 "motor": "css",
 "duracao": 4,
 "descricao": "Uma etiqueta colorida em cima, o nome grande e um traço que se desenha embaixo.",
 "campos": [
  {"id": "etiqueta", "rotulo": "Etiqueta", "tipo": "texto", "padrao": "Convidado", "maximo": 20},
  {"id": "nome", "rotulo": "Nome", "tipo": "texto", "padrao": "Rafael Lima", "maximo": 36},
  {"id": "funcao", "rotulo": "Função", "tipo": "texto", "padrao": "Chef e criador de conteúdo", "maximo": 50},
  {"id": "cor_1", "rotulo": "Cor (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Cor (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Tarja com etiqueta: a etiqueta estala (escala com mola), o nome entra letra a letra e o traço em
     degradê se desenha por baixo da função. Tudo sai deslizando para a esquerda. -->
<style>
.tarja{position:absolute;left:calc(var(--u)*6);bottom:calc(var(--u)*10);display:flex;flex-direction:column;align-items:flex-start;
  gap:calc(var(--u)*1);text-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.6) rgba(0,0,0,.45);
  animation:sair .45s cubic-bezier(.7,0,.84,0) calc(var(--dur) - .45s) forwards}
.etiqueta{padding:calc(var(--u)*.5) calc(var(--u)*1.6);border-radius:999px;background:linear-gradient(110deg,var(--cor-1),var(--cor-2));
  color:#fff;font-weight:800;font-size:calc(var(--u)*2.4);letter-spacing:.14em;text-transform:uppercase;text-shadow:none;
  transform-origin:0 50%;animation:estalo .55s cubic-bezier(.2,1.6,.4,1) both}
.nome{color:var(--cor-texto);font-weight:800;font-size:calc(var(--u)*6);letter-spacing:-.025em;line-height:1.05;white-space:nowrap}
.letra{display:inline-block;animation:letra .45s cubic-bezier(.2,.8,.2,1) calc(.25s + var(--i) * .025s) both}
.funcao{color:var(--cor-texto);font-weight:500;font-size:calc(var(--u)*3.1);opacity:.85;white-space:nowrap;padding-bottom:calc(var(--u)*1);
  position:relative;animation:aparece .5s ease-out .6s both}
.funcao::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:calc(var(--u)*.45);border-radius:9px;
  background:linear-gradient(90deg,var(--cor-1),var(--cor-2));transform-origin:0 50%;animation:traco .7s cubic-bezier(.65,0,.35,1) .75s both}
@keyframes estalo{from{transform:scale(0)}}
@keyframes letra{from{opacity:0;transform:translateY(60%)}}
@keyframes aparece{from{opacity:0}}
@keyframes traco{from{transform:scaleX(0)}}
@keyframes sair{to{opacity:0;transform:translateX(calc(var(--u)*-6))}}
</style>
<div class="tarja"><div class="etiqueta">{{etiqueta}}</div><div class="nome">{{nome:letras}}</div><div class="funcao">{{funcao}}</div></div>
