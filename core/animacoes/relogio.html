<script type="application/json" id="modelo">
{
 "nome": "Relógio com horário",
 "categoria": "numeros",
 "motor": "canvas",
 "duracao": 4.5,
 "descricao": "Os ponteiros de um relógio giram rápido até o horário marcado, o mostrador estala e o texto do compromisso aparece.",
 "campos": [
  {"id": "hora", "rotulo": "Hora (0 a 23)", "tipo": "numero", "padrao": "19", "maximo": 0},
  {"id": "minuto", "rotulo": "Minuto", "tipo": "numero", "padrao": "30", "maximo": 0},
  {"id": "texto", "rotulo": "Texto", "tipo": "texto", "padrao": "Começa hoje às 19h30", "maximo": 36},
  {"id": "cor_1", "rotulo": "Ponteiros", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Aro", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Relógio: o mostrador cresce com mola; os ponteiros partem de 12h e dão voltas rápidas (desaceleração
     longa) até a hora marcada, e ao chegar o mostrador dá um tranco. O aro é um degradê das duas cores. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const hora = (parseInt(C.hora, 10) || 0) % 12;
  const minuto = Math.min(59, parseInt(C.minuto, 10) || 0);
  const alvoMin = (hora * 60 + minuto) + 720 * 2;
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const sai = TO.ease.inCubic(TO.prog(t, dur - 0.5, dur));
    const chega = 2.2;
    const s = TO.spring(t, 0.5, 2) + 0.06 * Math.exp(-(t - chega) * 8) * Math.sin((t - chega) * 30) * (t > chega ? 1 : 0);
    const cx = W / 2;
    const cy = H / 2 - 5 * u;
    const r = 17 * u;
    ctx.globalAlpha = 1 - sai;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = "rgba(255,255,255,.95)";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fill();
    ctx.lineWidth = 1.6 * u;
    ctx.strokeStyle = TO.degrade(ctx, -r, -r, r, r);
    ctx.stroke();
    ctx.strokeStyle = "#14151b";
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * 6.2832;
      ctx.lineWidth = (i % 3 ? 0.35 : 0.7) * u;
      ctx.beginPath();
      ctx.moveTo(Math.sin(a) * r * 0.78, -Math.cos(a) * r * 0.78);
      ctx.lineTo(Math.sin(a) * r * 0.9, -Math.cos(a) * r * 0.9);
      ctx.stroke();
    }
    const m = alvoMin * TO.ease.outQuart(TO.prog(t, 0.3, chega));
    const aMin = (m / 60) * 6.2832;
    const aHora = (m / 720) * 6.2832;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#14151b";
    ctx.lineWidth = 1 * u;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.sin(aHora) * r * 0.5, -Math.cos(aHora) * r * 0.5);
    ctx.stroke();
    ctx.strokeStyle = C.cor_1;
    ctx.lineWidth = 0.6 * u;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.sin(aMin) * r * 0.75, -Math.cos(aMin) * r * 0.75);
    ctx.stroke();
    ctx.fillStyle = C.cor_1;
    ctx.beginPath();
    ctx.arc(0, 0, 1.1 * u, 0, 6.2832);
    ctx.fill();
    ctx.restore();
    const k = TO.ease.outCubic(TO.prog(t, chega, chega + 0.6));
    ctx.globalAlpha = (1 - sai) * k;
    ctx.fillStyle = C.cor_texto;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(0,0,0,.55)";
    ctx.shadowBlur = 2 * u;
    ctx.font = TO.fonte(800, Math.min(5.4, TO.caber(ctx, C.texto, 800, 5.4, W * 0.86)));
    ctx.fillText(C.texto, cx, cy + r + 5 * u + (1 - k) * 2 * u);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  };
})();
</script>
