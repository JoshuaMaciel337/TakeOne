<script type="application/json" id="modelo">
{
 "nome": "Porcentagem em pontos",
 "categoria": "numeros",
 "motor": "canvas",
 "duracao": 4.5,
 "descricao": "Uma grade de 100 pontos se acende até a porcentagem, ao lado do número que conta e da legenda.",
 "campos": [
  {"id": "valor", "rotulo": "Porcentagem (0 a 100)", "tipo": "numero", "padrao": "73", "maximo": 0},
  {"id": "legenda", "rotulo": "Legenda", "tipo": "texto", "padrao": "dos clientes voltam no mesmo mês", "maximo": 50},
  {"id": "cor_1", "rotulo": "Pontos (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Pontos (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Pontos: 10 × 10 pontos apagados aparecem em onda diagonal; depois os primeiros N acendem na ordem de
     leitura (linha a linha, de baixo para cima, como um copo enchendo), cada um com um pulo. O número conta
     junto. No quadro deitado o texto fica ao lado da grade; em pé e no quadrado, embaixo. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const valor = Math.min(100, Math.max(0, parseInt(C.valor, 10) || 0));
  const deitado = W / H > 1.3;

  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const env = TO.envelope(t, 0.3, 0.45, dur);
    const lado = 44 * u;
    const gx = deitado ? W / 2 - lado - 6 * u : W / 2 - lado / 2;
    const gy = deitado ? H / 2 - lado / 2 : H / 2 - lado / 2 - 12 * u;
    const passo = lado / 10;
    const r = passo * 0.36;
    const enche = TO.ease.inOutCubic(TO.prog(t, 0.9, 2.6));
    const acesos = valor * enche;
    ctx.globalAlpha = env;
    for (let i = 0; i < 100; i++) {
      const lin = 9 - Math.floor(i / 10);
      const col = i % 10;
      const nasce = TO.ease.outBack(TO.prog(t, 0.05 + (lin + col) * 0.025, 0.35 + (lin + col) * 0.025));
      if (nasce <= 0) continue;
      const cx = gx + (col + 0.5) * passo;
      const cy = gy + (lin + 0.5) * passo;
      const aceso = TO.clamp(acesos - i);
      const pulo = aceso > 0 && aceso < 1 ? 1 + 0.35 * Math.sin(aceso * Math.PI) : 1;
      ctx.beginPath();
      ctx.arc(cx, cy, r * nasce * pulo, 0, 6.2832);
      ctx.fillStyle = aceso > 0 ? TO.mix(C.cor_1, C.cor_2, i / 99) : "rgba(255,255,255,.16)";
      ctx.globalAlpha = env * (aceso > 0 ? 0.35 + 0.65 * aceso : 1);
      ctx.fill();
    }
    ctx.globalAlpha = env;
    // O número e a legenda
    const n = Math.round(acesos);
    const tx = deitado ? W / 2 + 4 * u : W / 2;
    const ty = deitado ? H / 2 - 2 * u : gy + lado + 16 * u;
    ctx.textAlign = deitado ? "left" : "center";
    ctx.textBaseline = "alphabetic";
    ctx.font = TO.fonte(900, 18, "Montserrat");
    ctx.fillStyle = TO.degrade(ctx, tx - 10 * u, ty - 15 * u, tx + 30 * u, ty);
    ctx.shadowColor = "rgba(0,0,0,.4)";
    ctx.shadowBlur = 2 * u;
    ctx.fillText(`${n}%`, tx, ty);
    const largura = deitado ? Math.min(W / 2 - 10 * u, 76 * u) : W * 0.86;
    ctx.font = TO.fonte(600, 4);
    const linhas = TO.quebrar(ctx, C.legenda, largura).slice(0, 3);
    ctx.fillStyle = C.cor_texto;
    ctx.globalAlpha = env * TO.prog(t, 0.6, 1.1);
    linhas.forEach((l, i) => ctx.fillText(l, tx, ty + 7 * u + i * 5.2 * u));
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  };
})();
</script>
