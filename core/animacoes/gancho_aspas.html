<script type="application/json" id="modelo">
{
 "nome": "Frase entre aspas",
 "categoria": "ganchos",
 "motor": "canvas",
 "duracao": 3.5,
 "descricao": "Aspas enormes se abrem e a frase forte aparece entre elas, em serifada, como uma citação de abertura.",
 "campos": [
  {"id": "texto", "rotulo": "Frase", "tipo": "texto", "padrao": "Eu quase desisti no dia em que tudo mudou", "maximo": 80},
  {"id": "cor_1", "rotulo": "Cor das aspas", "tipo": "cor", "padrao": "#ffd166"},
  {"id": "cor_texto", "rotulo": "Cor da frase", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Frase entre aspas: as aspas (desenhadas como dois pares de vírgulas grossas) entram com mola de cada lado; a frase
     aparece linha a linha em Georgia itálica (a serifada do sistema), com uma faixa escura atrás. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  function aspas(x, y, r, invertida) {
    ctx.save();
    ctx.translate(x, y);
    if (invertida) ctx.rotate(Math.PI);
    for (const dx of [-r * 1.15, r * 1.15]) {
      ctx.beginPath();
      ctx.arc(dx, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(dx - r, 0);
      ctx.quadraticCurveTo(dx - r, r * 2.2, dx + r * 0.6, r * 2.6);
      ctx.quadraticCurveTo(dx - r * 0.1, r * 1.6, dx, 0);
      ctx.fill();
    }
    ctx.restore();
  }
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    // Cada quadro começa do zero (a sombra e a transparência do anterior não passam para este)
    ctx.reset();
    const geral = TO.envelope(t, 0.15, 0.35, dur);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const fonte = (tam) => `italic 700 ${tam * u}px Georgia, "Times New Roman", serif`;
    ctx.font = fonte(6.4);
    const linhas = TO.quebrar(ctx, C.texto || "", W * 0.74).slice(0, 4);
    const entrelinha = 8 * u;
    const altura = linhas.length * entrelinha;
    ctx.globalAlpha = geral * 0.55;
    ctx.fillStyle = "#000000";
    TO.retangulo(ctx, W * 0.07, H / 2 - altura / 2 - 11 * u, W * 0.86, altura + 24 * u, 3 * u);
    ctx.fill();
    ctx.globalAlpha = geral;
    ctx.fillStyle = C.cor_1;
    const r = 2.2 * u;
    const m1 = TO.spring(TO.clamp(t - 0.05, 0, 9), 0.5, 2.4);
    const m2 = TO.spring(TO.clamp(t - 0.2, 0, 9), 0.5, 2.4);
    ctx.save();
    ctx.translate(W * 0.17, H / 2 - altura / 2 - 8 * u);
    ctx.scale(m1, m1);
    aspas(0, 0, r, false);
    ctx.restore();
    ctx.save();
    ctx.translate(W * 0.83, H / 2 + altura / 2 + 9.5 * u);
    ctx.scale(m2, m2);
    aspas(0, 0, r, true);
    ctx.restore();
    ctx.font = fonte(6.4);
    ctx.fillStyle = C.cor_texto;
    linhas.forEach((l, i) => {
      const p = TO.ease.outCubic(TO.prog(t, 0.35 + i * 0.18, 0.75 + i * 0.18));
      if (p <= 0) return;
      ctx.globalAlpha = geral * p;
      ctx.fillText(l, W / 2, H / 2 - altura / 2 + entrelinha * (i + 0.5) + (1 - p) * 2 * u);
    });
  };
})();
</script>
