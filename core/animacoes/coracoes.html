<script type="application/json" id="modelo">
{
 "nome": "Corações no ar",
 "categoria": "fundos",
 "motor": "canvas",
 "duracao": 6,
 "tela_cheia": true,
 "descricao": "Corações de vários tamanhos sobem pela tela inteira, girando e pulsando, com uma mensagem no centro.",
 "campos": [
  {"id": "titulo", "rotulo": "Mensagem", "tipo": "texto", "padrao": "Te amo, mãe", "maximo": 30},
  {"id": "cor_1", "rotulo": "Corações 1", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_2", "rotulo": "Corações 2", "tipo": "cor", "padrao": "#ff8fab"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Corações: 60 corações sorteados por índice sobem do fundo até o topo e recomeçam (resto da divisão),
     em duas camadas (os de trás menores e apagados); cada um gira e pulsa de leve. A mensagem em letra
     cursiva bate como um coração uma vez ao entrar. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const N = 60;
  const itens = Array.from({ length: N }, (_, i) => {
    const r = TO.rng(4000 + i);
    return { x: r(), y: r(), tam: 1 + r() * 2.6, vel: 0.06 + r() * 0.08, fase: r() * 6.28, cor: r() < 0.5 ? C.cor_1 : C.cor_2, longe: r() < 0.5 };
  });
  const coracao = (s) => {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.05, 0, -s * 0.45);
    ctx.bezierCurveTo(s * 0.45, -s * 1.05, s * 1.1, -s * 0.35, 0, s * 0.35);
    ctx.fill();
  };
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const env = TO.envelope(t, 0.6, 0.6, dur);
    for (const c of itens) {
      const y = 1.06 - ((c.y + t * c.vel) % 1.12);
      const x = c.x * W + Math.sin(t * 1.2 + c.fase) * 2 * u;
      ctx.globalAlpha = env * (c.longe ? 0.35 : 0.85);
      ctx.fillStyle = c.cor;
      ctx.save();
      ctx.translate(x, y * H);
      ctx.rotate(Math.sin(t + c.fase) * 0.3);
      const s = c.tam * u * (c.longe ? 0.6 : 1) * (1 + 0.08 * Math.sin(t * 5 + c.fase));
      coracao(s);
      ctx.restore();
    }
    const k = TO.ease.outCubic(TO.prog(t, 0.5, 1.2));
    const batida = 1 + 0.12 * Math.exp(-((t - 1.4) ** 2) / 0.01) + 0.08 * Math.exp(-((t - 1.65) ** 2) / 0.01);
    ctx.globalAlpha = env * k;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(batida * (0.9 + 0.1 * k), batida * (0.9 + 0.1 * k));
    ctx.fillStyle = C.cor_texto;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = TO.rgba(C.cor_1, 0.8);
    ctx.shadowBlur = 3 * u;
    ctx.font = TO.fonte(600, TO.caber(ctx, C.titulo, 600, 15, W * 0.84, "Caveat"), "Caveat");
    ctx.fillText(C.titulo, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  };
})();
</script>
