<script type="application/json" id="modelo">
{
 "nome": "Marca letra por letra",
 "categoria": "logos",
 "motor": "css",
 "duracao": 4,
 "descricao": "As letras da marca caem uma a uma e quicam no lugar; um traço em degradê sublinha o nome e o slogan aparece.",
 "campos": [
  {"id": "texto", "rotulo": "Nome da marca", "tipo": "texto", "padrao": "boing", "maximo": 16},
  {"id": "slogan", "rotulo": "Slogan (opcional)", "tipo": "texto", "padrao": "brinquedos que pulam de alegria", "maximo": 40},
  {"id": "cor_1", "rotulo": "Traço (início)", "tipo": "cor", "padrao": "#ffd166"},
  {"id": "cor_2", "rotulo": "Traço (fim)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_texto", "rotulo": "Cor das letras", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Letra por letra: cada letra cai do alto com uma curva de quique (a keyframe passa do lugar, sobe e
     assenta), 0,07 s depois da anterior, e se achata um pouco ao bater (scaleY). O traço cresce do meio
     depois da última letra. -->
<style>
.marca{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4);
  animation:sair .5s ease-in calc(var(--dur) - .5s) forwards}
.nome{font-family:Montserrat;font-weight:900;font-size:calc(var(--u)*15);line-height:1;letter-spacing:-.02em;color:var(--cor-texto);white-space:nowrap;
  text-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.6) rgba(0,0,0,.4)}
.letra{display:inline-block;transform-origin:50% 100%;animation:cair .8s linear calc(.1s + var(--i) * .07s) both}
.traco{width:min(calc(var(--u)*50),80%);height:calc(var(--u)*1);border-radius:calc(var(--u)*.5);background:linear-gradient(90deg,var(--cor-1),var(--cor-2));
  animation:crescer .6s cubic-bezier(.65,0,.35,1) 1s both}
.slogan{font-weight:600;font-size:calc(var(--u)*3.8);color:var(--cor-texto);opacity:.9;text-align:center;text-shadow:0 calc(var(--u)*.2) calc(var(--u)*1.2) rgba(0,0,0,.5);
  animation:aparecer .5s ease-out 1.3s both}
.slogan:empty{display:none}
@keyframes cair{
  0%{opacity:0;transform:translateY(-120%);animation-timing-function:cubic-bezier(.5,0,1,.5)}
  40%{opacity:1;transform:translateY(0) scaleY(1);animation-timing-function:ease-out}
  48%{transform:translateY(0) scaleX(1.12) scaleY(.82)}
  62%{transform:translateY(-22%) scaleY(1.04);animation-timing-function:cubic-bezier(.5,0,1,.5)}
  78%{transform:translateY(0) scaleX(1.05) scaleY(.92)}
  88%{transform:translateY(-6%)}
  100%{transform:translateY(0)}}
@keyframes crescer{from{transform:scaleX(0)}}
@keyframes aparecer{from{opacity:0;transform:translateY(calc(var(--u)*1.5))}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
</style>
<div class="marca"><div class="nome">{{texto:letras}}</div><div class="traco"></div><div class="slogan">{{slogan}}</div></div>
