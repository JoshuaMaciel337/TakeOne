<script type="application/json" id="modelo">
{
 "nome": "Versículo com luz",
 "categoria": "citacoes",
 "motor": "css",
 "duracao": 7,
 "descricao": "Raios de luz giram devagar atrás de um texto que entra palavra por palavra, com a referência embaixo.",
 "campos": [
  {"id": "texto", "rotulo": "Texto", "tipo": "texto", "padrao": "O Senhor é o meu pastor; nada me faltará.", "maximo": 160},
  {"id": "referencia", "rotulo": "Referência", "tipo": "texto", "padrao": "Salmos 23:1", "maximo": 30},
  {"id": "cor_1", "rotulo": "Luz", "tipo": "cor", "padrao": "#ffd79a"},
  {"id": "cor_2", "rotulo": "Detalhe", "tipo": "cor", "padrao": "#ffb547"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Versículo: um disco de raios (conic-gradient) gira atrás e uma luz suave respira; as palavras sobem
     em sequência com um leve desfoque que some, e a referência aparece entre dois traços finos. A luz fica
     dentro de um círculo que não chega à borda do quadro. -->
<style>
.luz{position:absolute;left:50%;top:50%;width:calc(var(--u)*90);height:calc(var(--u)*90);margin:calc(var(--u)*-45) 0 0 calc(var(--u)*-45);
  border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--cor-1) 30%,transparent) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(closest-side,#000 10%,transparent 100%);mask:radial-gradient(closest-side,#000 10%,transparent 100%);
  animation:aparecer 1.2s ease-out both,girar 30s linear infinite,sair .6s ease-in calc(var(--dur) - .6s) forwards}
.brilho{position:absolute;left:50%;top:50%;width:calc(var(--u)*60);height:calc(var(--u)*60);margin:calc(var(--u)*-30) 0 0 calc(var(--u)*-30);border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--cor-1) 35%,transparent),transparent);
  animation:aparecer 1.2s ease-out both,respirar 3s ease-in-out infinite alternate,sair .6s ease-in calc(var(--dur) - .6s) forwards}
.bloco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(var(--u)*88),86%);text-align:center;color:var(--cor-texto);
  animation:sair .6s ease-in calc(var(--dur) - .6s) forwards}
.texto{font-family:Montserrat,sans-serif;font-weight:700;font-size:calc(var(--u)*6);line-height:1.3;text-shadow:0 calc(var(--u)*.3) calc(var(--u)*2.4) rgba(0,0,0,.55)}
.palavra{display:inline-block;margin:0 .13em;animation:entrar .7s cubic-bezier(.2,.8,.2,1) calc(.6s + var(--i) * .14s) both}
.ref{display:inline-flex;align-items:center;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*3);font-weight:600;font-size:calc(var(--u)*3);
  letter-spacing:.12em;text-transform:uppercase;color:var(--cor-2);animation:aparecer .8s ease-out 2.2s both}
.ref::before,.ref::after{content:"";width:calc(var(--u)*6);height:calc(var(--u)*.25);background:currentColor;opacity:.7}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes respirar{to{transform:scale(1.15)}}
@keyframes entrar{from{opacity:0;filter:blur(calc(var(--u)*.6));transform:translateY(calc(var(--u)*2))}}
@keyframes sair{to{opacity:0}}
</style>
<div class="luz"></div><div class="brilho"></div>
<div class="bloco"><div class="texto">{{texto:palavras}}</div><div class="ref">{{referencia}}</div></div>
