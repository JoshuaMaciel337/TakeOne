<script type="application/json" id="modelo">
{
 "nome": "Título com palavra girando",
 "categoria": "titulos",
 "motor": "css",
 "duracao": 4.5,
 "descricao": "Uma frase fixa e, ao lado, uma palavra que troca rolando para cima até parar na última.",
 "campos": [
  {"id": "texto", "rotulo": "Começo da frase", "tipo": "texto", "padrao": "Feito para", "maximo": 24},
  {"id": "palavras", "rotulo": "Palavras que giram (uma por linha)", "tipo": "linhas", "padrao": "criar\nvender\ncrescer\nvocê", "maximo": 80},
  {"id": "cor_1", "rotulo": "Palavra (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Palavra (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor da frase", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Rolo: todas as palavras ficam empilhadas na mesma célula da grade (a caixa fica com a largura da maior)
     e cada uma sobe para dentro e depois para fora, uma a cada 0,7 s; a última não sai. A caixa tem
     overflow escondido, como uma janela de caça-níquel. -->
<style>
.frase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90%;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;column-gap:calc(var(--u)*2.4);row-gap:calc(var(--u)*.6);
  font-family:Montserrat;font-weight:800;font-size:calc(var(--u)*10);letter-spacing:-.02em;line-height:1.15;
  animation:sair .45s ease-in calc(var(--dur) - .45s) forwards}
.fixo{color:var(--cor-texto);text-shadow:0 calc(var(--u)*.3) calc(var(--u)*1.6) rgba(0,0,0,.5);white-space:nowrap;
  animation:entrar .6s cubic-bezier(.2,.8,.2,1) both}
.janela{display:grid;overflow:hidden;padding:0 calc(var(--u)*2.2);border-radius:calc(var(--u)*2);
  background:linear-gradient(110deg,var(--cor-1),var(--cor-2));color:#fff;animation:abrir .5s cubic-bezier(.2,.8,.2,1) .25s both}
.linha{grid-area:1/1;text-align:center;white-space:nowrap;transform:translateY(110%);
  animation:subir .42s cubic-bezier(.3,1.3,.5,1) calc(.55s + var(--i) * .7s) forwards,
    passar .32s cubic-bezier(.6,0,.8,.3) calc(1.05s + var(--i) * .7s) forwards}
.linha:last-child{animation:subir .42s cubic-bezier(.3,1.3,.5,1) calc(.55s + var(--i) * .7s) forwards}
@keyframes subir{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes passar{from{transform:translateY(0)}to{transform:translateY(-110%)}}
@keyframes entrar{from{opacity:0;transform:translateY(calc(var(--u)*3))}}
@keyframes abrir{from{opacity:0;transform:scaleX(.4)}}
@keyframes sair{to{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
</style>
<div class="frase"><span class="fixo">{{texto}}</span><span class="janela">{{palavras:linhas}}</span></div>
