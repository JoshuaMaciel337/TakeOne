<script type="application/json" id="modelo">
{
 "nome": "Partículas com título",
 "categoria": "fundos",
 "motor": "canvas",
 "duracao": 5,
 "tela_cheia": true,
 "descricao": "Faíscas sobem e brilham em volta de um título que acende no centro.",
 "campos": [
  {"id": "texto", "rotulo": "Título", "tipo": "texto", "padrao": "Bem-vindos", "maximo": 40},
  {"id": "cor_1", "rotulo": "Faíscas (início)", "tipo": "cor", "padrao": "#ff624a"},
  {"id": "cor_2", "rotulo": "Faíscas (fim)", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do título", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Partículas: 260 faíscas com posição, velocidade e piscar sorteados por índice; cada quadro calcula
     onde elas estão no instante t (sem guardar estado). O título acende com brilho e as faíscas somem no fim. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const N = 260;
  const faiscas = Array.from({ length: N }, (_, i) => {
    const r = TO.rng(1000 + i);
    return { x: r(), y: r(), vel: 0.05 + r() * 0.12, tam: 0.15 + r() * 0.5, fase: r() * 6.28, osc: 0.01 + r() * 0.03, cor: r() };
  });
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    const env = TO.envelope(t, 0.8, 0.8, dur);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (const f of faiscas) {
      // Sobem sem parar e voltam por baixo (posição só depende de t)
      const y = (((f.y - f.vel * t) % 1) + 1) % 1;
      const x = f.x + Math.sin(t * 1.3 + f.fase) * f.osc;
      const brilho = (0.5 + 0.5 * Math.sin(t * 5 + f.fase * 3)) * env;
      const raio = f.tam * u * (1 + 0.4 * brilho);
      ctx.globalAlpha = 0.9 * brilho;
      ctx.drawImage(TO.brilho(f.cor < 0.5 ? C.cor_1 : C.cor_2), x * W - raio * 4, y * H - raio * 4, raio * 8, raio * 8);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    // O título acende: sobe, ganha brilho e espaçamento normal
    const k = TO.ease.outExpo(TO.prog(t, 0.4, 1.6));
    const sai = TO.ease.inCubic(TO.prog(t, dur - 0.7, dur));
    const tam = TO.caber(ctx, C.texto, 800, 12, W * 0.84);
    ctx.save();
    ctx.font = TO.fonte(800, tam);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = k * (1 - sai);
    ctx.shadowColor = TO.rgba(C.cor_2, 0.9);
    ctx.shadowBlur = 4 * u * (0.6 + 0.4 * Math.sin(t * 2.4));
    ctx.fillStyle = C.cor_texto;
    ctx.translate(W / 2, H / 2 + (1 - k) * 4 * u - sai * 3 * u);
    ctx.scale(1 + (1 - k) * 0.08, 1 + (1 - k) * 0.08);
    ctx.fillText(C.texto, 0, 0);
    ctx.restore();
  };
})();
</script>
