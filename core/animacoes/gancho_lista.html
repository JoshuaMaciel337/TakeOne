<script type="application/json" id="modelo">
{
 "nome": "Lista que promete",
 "categoria": "ganchos",
 "motor": "canvas",
 "duracao": 3.5,
 "descricao": "O título (\"3 erros que...\") e os números da lista acendendo um a um, com os itens escondidos, para prender até o fim.",
 "campos": [
  {"id": "texto", "rotulo": "Título", "tipo": "texto", "padrao": "3 ERROS QUE TE DEIXAM POBRE", "maximo": 40},
  {"id": "numero", "rotulo": "Quantos itens", "tipo": "numero", "padrao": "3", "maximo": 1},
  {"id": "cor_1", "rotulo": "Cor dos números", "tipo": "cor", "padrao": "#ff3478"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Lista que promete: o título desce do alto com mola; embaixo, de 2 a 5 linhas numeradas, cada uma com uma tarja
     "borrada" (barras cinza de larguras sorteadas, sempre as mesmas) no lugar do item, acendendo a cada 0,25 s. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  const itens = Math.max(2, Math.min(5, Math.round(Number(C.numero) || 3)));
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    // Cada quadro começa do zero (a sombra e a transparência do anterior não passam para este)
    ctx.reset();
    const geral = TO.envelope(t, 0.15, 0.35, dur);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = TO.fonte(900, 7, "Montserrat");
    const linhas = TO.quebrar(ctx, C.texto || "", W * 0.84).slice(0, 2);
    const tam = Math.min(...linhas.map((l) => TO.caber(ctx, l, 900, 7, W * 0.84, "Montserrat")));
    const passo = 9 * u;
    const alturaTotal = linhas.length * tam * u * 1.1 + 4 * u + itens * passo;
    let y = H / 2 - alturaTotal / 2 + tam * u * 0.55;
    const mola = TO.spring(TO.clamp(t - 0.05, 0, 9), 0.55, 2.2);
    ctx.globalAlpha = geral * Math.min(1, t * 5);
    ctx.font = TO.fonte(900, tam, "Montserrat");
    ctx.fillStyle = C.cor_texto;
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 1.5 * u;
    linhas.forEach((l, i) => ctx.fillText(l, W / 2, y + i * tam * u * 1.1 - (1 - mola) * 8 * u));
    y += linhas.length * tam * u * 1.1 + 4 * u;
    const largura = Math.min(W * 0.72, 70 * u);
    for (let i = 0; i < itens; i++) {
      const p = TO.ease.outBack(TO.prog(t, 0.6 + i * 0.25, 0.95 + i * 0.25));
      if (p <= 0) continue;
      ctx.save();
      ctx.globalAlpha = geral * Math.min(1, p);
      ctx.translate(W / 2 - largura / 2, y + i * passo);
      ctx.shadowColor = "transparent";
      ctx.fillStyle = C.cor_1;
      ctx.beginPath();
      ctx.arc(3 * u, 0, 3 * u * p, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = TO.fonte(900, 3.6, "Montserrat");
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(i + 1), 3 * u, 0.2 * u);
      // O item escondido: barras de larguras sorteadas, como texto borrado
      let x = 8 * u;
      for (let k = 0; k < 3; k++) {
        const w = (largura - 10 * u) * (0.18 + 0.2 * TO.hash(i * 3 + k, 11)) * p;
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        TO.retangulo(ctx, x, -1.4 * u, w, 2.8 * u, 1.4 * u);
        ctx.fill();
        x += w + 1.5 * u;
      }
      ctx.restore();
    }
  };
})();
</script>
