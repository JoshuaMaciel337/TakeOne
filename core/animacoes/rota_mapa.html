<script type="application/json" id="modelo">
{
 "nome": "Rota de A a B",
 "categoria": "tarjas",
 "motor": "canvas",
 "duracao": 5,
 "descricao": "Uma linha tracejada curva liga a origem ao destino, com um ícone que viaja por ela e os nomes nas pontas.",
 "campos": [
  {"id": "origem", "rotulo": "Origem", "tipo": "texto", "padrao": "São Paulo", "maximo": 22},
  {"id": "destino", "rotulo": "Destino", "tipo": "texto", "padrao": "Lisboa", "maximo": 22},
  {"id": "detalhe", "rotulo": "Detalhe", "tipo": "texto", "padrao": "10 h de voo", "maximo": 30},
  {"id": "cor_1", "rotulo": "Rota (início)", "tipo": "cor", "padrao": "#6bd8f2"},
  {"id": "cor_2", "rotulo": "Rota (fim)", "tipo": "cor", "padrao": "#ffd166"},
  {"id": "cor_texto", "rotulo": "Cor do texto", "tipo": "cor", "padrao": "#ffffff"}
 ]
}
</script>
<!-- Rota: os dois pontos estalam; uma curva quadrática (arco para cima) é desenhada tracejada até a fração
     k, e um avião em triângulo segue a ponta, girado na direção da tangente. Os nomes ficam embaixo dos pontos
     e o detalhe no alto do arco. -->
<script>
(() => {
  const { largura: W, altura: H, u } = window.QUADRO;
  const C = window.CAMPOS;
  const ctx = TO.canvas2d();
  window.renderAt = (t) => {
    const dur = window.DURACAO;
    ctx.clearRect(0, 0, W, H);
    const sai = TO.ease.inCubic(TO.prog(t, dur - 0.5, dur));
    const larg = Math.min(W * 0.68, 90 * u);
    const a = [W / 2 - larg / 2, H / 2 + 6 * u];
    const b = [W / 2 + larg / 2, H / 2 + 6 * u];
    const c = [W / 2, H / 2 - 22 * u];
    const ponto = (q) => [
      (1 - q) ** 2 * a[0] + 2 * (1 - q) * q * c[0] + q * q * b[0],
      (1 - q) ** 2 * a[1] + 2 * (1 - q) * q * c[1] + q * q * b[1],
    ];
    ctx.globalAlpha = 1 - sai;
    const k = TO.ease.inOutCubic(TO.prog(t, 0.6, 2.8));
    ctx.strokeStyle = TO.degrade(ctx, a[0], 0, b[0], 0);
    ctx.lineWidth = 0.6 * u;
    ctx.lineCap = "round";
    ctx.setLineDash([1.6 * u, 1.6 * u]);
    ctx.beginPath();
    for (let i = 0; i <= 80 * k; i++) {
      const [x, y] = ponto(i / 80);
      if (i) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    [[a, C.origem, 0, C.cor_1], [b, C.destino, 2.6, C.cor_2]].forEach(([p, nome, quando, cor]) => {
      const s = TO.spring(t - quando * 0.9 - 0.1, 0.45, 2.4);
      if (s <= 0) return;
      ctx.fillStyle = cor;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 1.6 * u * s, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = TO.rgba(cor, 0.4);
      ctx.lineWidth = 0.5 * u;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 3 * u * s, 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = (1 - sai) * TO.clamp(s);
      ctx.fillStyle = C.cor_texto;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.shadowColor = "rgba(0,0,0,.6)";
      ctx.shadowBlur = 1.5 * u;
      ctx.font = TO.fonte(800, Math.min(4.4, TO.caber(ctx, nome, 800, 4.4, larg * 0.6)));
      // Centrado no ponto, mas sem passar da borda do quadro
      const meia = ctx.measureText(nome).width / 2;
      ctx.fillText(nome, TO.clamp(p[0], meia + 3 * u, W - meia - 3 * u), p[1] + 4.4 * u);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1 - sai;
    });
    // Avião na ponta
    if (k > 0 && k < 1) {
      const [x, y] = ponto(k);
      const [x2, y2] = ponto(Math.min(1, k + 0.01));
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(y2 - y, x2 - x));
      ctx.fillStyle = "#fff";
      const s = 2.4 * u;
      ctx.beginPath();
      ctx.moveTo(s * 1.4, 0);
      ctx.lineTo(-s, -s * 0.9);
      ctx.lineTo(-s * 0.5, 0);
      ctx.lineTo(-s, s * 0.9);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    const d = TO.ease.outCubic(TO.prog(t, 1.6, 2.2));
    ctx.globalAlpha = (1 - sai) * d;
    ctx.fillStyle = C.cor_texto;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.font = TO.fonte(600, 3.2);
    ctx.fillText(C.detalhe, c[0], H / 2 - 12 * u);
    ctx.globalAlpha = 1;
  };
})();
</script>
