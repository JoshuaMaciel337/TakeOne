# -----------------------------------------------
# TakeOne — todos os serviços
#
# Subir tudo:                 docker compose up --build -d
# Gerar vídeo com IA (Wan 2.2):  docker compose --profile gpu --profile video up --build -d
# Túnel rápido para testes:   docker compose --profile tunel-rapido up -d
# Túnel fixo (produção):      docker compose --profile tunel up -d
#
# Antes da primeira vez: copie .env.example para .env e defina JWT_SEGREDO.
# As portas padrão (27019, 8010, 3010) não batem com as do HolyCut, que roda no mesmo Nitro 5.
# -----------------------------------------------
name: takeone

x-ambiente-python: &ambiente-python
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  DATABASE_NAME: ${DATABASE_NAME:-takeone}
  PASTA_ARMAZENAMENTO: /dados/armazenamento
  TZ: America/Sao_Paulo

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # Só acessível a partir deste computador (MongoDB Compass). Nunca exposto no túnel.
    ports: ["127.0.0.1:${MONGO_PORTA:-27019}:27017"]
    volumes: [mongo_dados:/data/db]
    healthcheck:
      # Inicia o replica set na primeira subida. Ele é necessário para os eventos ao vivo.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    image: takeone/api:local
    environment:
      <<: *ambiente-python
      JWT_SEGREDO: ${JWT_SEGREDO:?Defina JWT_SEGREDO no arquivo .env}
      SESSAO_DIAS: ${SESSAO_DIAS:-7}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-false}
      MODO_IA: ${MODO_IA:-simulado}
      UPLOAD_MAX_GB: ${UPLOAD_MAX_GB:-20}
      ESPACO_MINIMO_LIVRE_GB: ${ESPACO_MINIMO_LIVRE_GB:-2}
      # O banco de imagens e vídeos (vazia, ele fica desligado)
      PIXABAY_CHAVE: ${PIXABAY_CHAVE:-}
    volumes: ["${PASTA_ARMAZENAMENTO_HOST:-./armazenamento}:/dados/armazenamento"]
    ports: ["127.0.0.1:${API_PORTA:-8010}:8000"]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped

  worker-cpu:
    build: {context: ., dockerfile: infra/docker/worker.Dockerfile}
    image: takeone/worker:local
    command: ["python", "-m", "worker.worker_principal", "--automatico", "--recursos", "cpu"]
    environment:
      <<: *ambiente-python
      MODO_IA: ${MODO_IA:-simulado}
    volumes: ["${PASTA_ARMAZENAMENTO_HOST:-./armazenamento}:/dados/armazenamento"]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped

  # A montagem dos cortes do Clipar (o código TS do editor pelo Deno, ADR 0004): num worker só dela, porque ela
  # espera jobs de CPU (o rosto, as animações). Fala só com a API, por uma chave temporária do dono do pedido.
  worker-montagem:
    build: {context: ., dockerfile: infra/docker/worker.Dockerfile}
    image: takeone/worker:local
    command: ["python", "-m", "worker.worker_principal", "--automatico", "--recursos", "montagem"]
    environment:
      <<: *ambiente-python
      API_INTERNA: http://api:8000
    depends_on:
      mongo: {condition: service_healthy}
      api: {condition: service_started}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args: {API_URL_INTERNA: "http://api:8000"}
    image: takeone/web:local
    ports: ["127.0.0.1:${WEB_PORTA:-3010}:3000"]
    depends_on: [api]
    restart: unless-stopped

  # Transcrição na GPU (perfil gpu): docker compose --profile gpu up -d
  # Divide a placa com o HolyCut: um modelo por vez, cada fila com o seu worker.
  worker-gpu:
    profiles: [gpu]
    build: {context: ., dockerfile: infra/docker/worker-gpu.Dockerfile}
    image: takeone/worker-gpu:local
    environment:
      <<: *ambiente-python
      MODO_IA: real
      COMFYUI_URL: http://comfyui:8188
      OLLAMA_URL: http://ollama:11434
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - "${PASTA_ARMAZENAMENTO_HOST:-./armazenamento}:/dados/armazenamento"
      - modelos_ia:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on:
      mongo: {condition: service_healthy}
    restart: unless-stopped

  # LLM local do "Criar automaticamente" (Qwen3 8B, Apache-2.0), só na rede interna. O modelo é baixado
  # pelo worker no primeiro pedido (uns 5 GB) e sai da placa no fim de cada um (keep_alive 0).
  ollama:
    profiles: [gpu]
    image: ollama/ollama:0.34.4
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes: [ollama_modelos:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

  # Geração de vídeo com o Wan 2.2 (perfil video). O ComfyUI é GPL-3.0 e fica neste container, só
  # acessível pela rede interna; o worker de GPU conversa com ele por HTTP. Na primeira subida baixa uns
  # 17 GB de pesos. Gerar pede a placa livre e uns 9 GB de RAM: com o HolyCut usando a GPU, o pedido espera.
  comfyui:
    profiles: [video]
    build: {context: ., dockerfile: infra/docker/comfyui.Dockerfile}
    image: takeone/comfyui:local
    # A interface do ComfyUI, só neste computador (http://localhost:8188). O que se gera por ela não passa
    # pela checagem de memória do worker nem entra na biblioteca.
    ports: ["127.0.0.1:${COMFYUI_PORTA:-8188}:8188"]
    volumes: [comfyui_modelos:/modelos]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped

  backup:
    build: {context: ., dockerfile: infra/docker/worker.Dockerfile}
    image: takeone/worker:local
    command: ["python", "-m", "backup.agendador_backup", "--automatico"]
    environment:
      <<: *ambiente-python
      PASTA_BACKUP: /dados/backups
      BACKUP_HORA: ${BACKUP_HORA:-03:30}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    # O armazenamento, para a limpeza diária das versões das camadas de pixels
    volumes:
      - "${PASTA_BACKUP_HOST:-./backups}:/dados/backups"
      - "${PASTA_ARMAZENAMENTO_HOST:-./armazenamento}:/dados/armazenamento"
    depends_on:
      mongo: {condition: service_healthy}
      worker-cpu: {condition: service_started}
    restart: unless-stopped

  # ---------- Acesso pela internet ----------
  tunel-rapido:
    profiles: [tunel-rapido]
    image: cloudflare/cloudflared:latest
    # Endereço aleatório *.trycloudflare.com, mostrado no log: docker compose logs tunel-rapido
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    depends_on: [web]
    restart: unless-stopped

  tunel:
    profiles: [tunel]
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  mongo_dados:
  # Pesos baixados do Hugging Face (o modelo de transcrição, uns 1,6 GB)
  modelos_ia:
  # Pesos do Wan 2.2 para o ComfyUI (uns 17 GB). Ler da pasta do Windows dava errno=12, por isso um volume
  comfyui_modelos:
  # Pesos do LLM local (Qwen3 8B, uns 5 GB)
  ollama_modelos:
